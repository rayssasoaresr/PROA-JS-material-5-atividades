<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cinco funções</title>
</head>
<body>
    <h2>Cadastro</h2>

    <script>
        function apresentarPessoa(nome, cidade, estuda, vaiFazerEnem) {
            console.log("Olá, " + nome + "!");
            console.log("Cidade: " + cidade);
            console.log("Estuda? " + estuda);
            console.log("Vai fazer Enem? " + vaiFazerEnem);
            console.log(" ");
        }

        apresentarPessoa("Rayssa", "Carapicuíba", "Sim", "Sim");
        apresentarPessoa("Larissa", "Carapicuíba", "Não", "Não");
        apresentarPessoa("Leonardo", "Carapicuíba", "Não", "Não");
        apresentarPessoa("Gabriel", "Carapicuíba", "Sim", "Sim");
        apresentarPessoa("Letícia", "Carapicuíba", "Sim", "Não");
    </script>
</body>
</html>
