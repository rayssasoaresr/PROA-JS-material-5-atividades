<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Return</title>
</head>
<body>
    <h1> Return</h1>
    <div id="saida"></div>

    <script>
        // COM return (DEVOLVE o valor)
        function somarComReturn(a, b) {
            return a + b;
        }

        let resultado = somarComReturn(10, 5);
        document.getElementById("saida").innerHTML =
            "Com return: " + resultado + "<br>";

        // SEM return (devolve undefined)
        function somarSemReturn(a, b) {
            let soma = a + b;
        }

        let resultado2 = somarSemReturn(10, 5);
        document.getElementById("saida").innerHTML +=
            "Sem return: " + resultado2;
    </script>
</body>
</html>
