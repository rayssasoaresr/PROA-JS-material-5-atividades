*<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Funções com Parâmetros</title>
</head>
<body>
  <h1>📦 Funções com Parâmetros</h1>
  
  <!-- Onde as mensagens vão aparecer -->
  <div id="resultado" style="padding: 15px; background: #f3e5f5; border-radius: 10px; margin-top: 20px; font-size: 18px;"></div>

  <script>
    // ==========================================
    // FUNÇÃO QUE RECEBE UM NOME
    // ==========================================
    function saudacao(nome) {
      console.log("👋 Olá, " + nome + "!");
      console.log("Bem-vindo(a) ao sistema!");
      console.log("---");
      
      // Retorna o HTML para mostrar na tela
      return "👋 Olá, " + nome + "!<br>Bem-vindo(a) ao sistema!<br>---<br><br>";
    }

    // ==========================================
    // CHAMANDO COM DIFERENTES ARGUMENTOS
    // ==========================================
    let resultado = document.getElementById("resultado");
    
    let html = "";
    
    html += saudacao("João");
    html += saudacao("Maria");
    html += saudacao("Pedro");
    html += saudacao("Ana");
    
    resultado.innerHTML = html;
  </script>
</body>
</html>
