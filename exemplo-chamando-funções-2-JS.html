<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Chamando Funções</title>
</head>
<body>
    <h1>📞 Chamando Funções</h1>
    <p>Abra o console (F12)</p>

    <script>
        // 1 CRIAR a função
        function mostrarMensagem() {
            console.log("📢 Esta é uma mensagem!");
            console.log("📢 Executando a função!");
            
            // Mostrando no HTML
            document.write("📢 Esta é uma mensagem!<br>");
            document.write("📢 Executando a função!<br>");
        }

        // 2 CHAMAR várias vezes
        console.log("--- Chamada 1 ---");
        document.write("<h3>--- Chamada 1 ---</h3>");
        mostrarMensagem();

        console.log("--- Chamada 2 ---");
        document.write("<h3>--- Chamada 2 ---</h3>");
        mostrarMensagem();

        console.log("--- Chamada 3 ---");
        document.write("<h3>--- Chamada 3 ---</h3>");
        mostrarMensagem();
    </script>
</body>
</html>
