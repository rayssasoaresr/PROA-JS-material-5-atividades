<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Funções</title>
</head>
<body>
    <h1>📦 Minha Primeira Função</h1>
    <p>Abra o console (F12) para ver o resultado</p>

    <script>
        // 1 CRIAR a função
        function saudacao() {
            console.log("Olá, mundo!");
            console.log("Bem-vindo!");
        }

        // 2 CHAMAR a função
        saudacao();
        saudacao();
        saudacao();
    </script>
</body>
</html>
