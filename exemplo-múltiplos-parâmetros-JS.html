<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Múltiplos Parâmetros</title>
</head>
<body>
  <h1>📦 Múltiplos Parâmetros</h1>
  <p>Abra o console (F12)</p>

  <script>
    function apresentar(nome, idade, cidade) {
      console.log("📋 FICHA CADASTRAL");
      console.log("Nome:", nome);
      console.log("Idade:", idade, "anos");
      console.log("Cidade:", cidade);
      console.log("---");
    }

    apresentar("João", 25, "São Paulo");
    apresentar("Maria", 30, "Rio de Janeiro");
    apresentar("Pedro", 22, "Belo Horizonte");
  </script>
</body>
</html>
