<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Parâmetros vs Argumentos</title>
</head>
<body>
  <h1>⚖️ Parâmetros vs Argumentos</h1>
  
  <!-- Onde as mensagens vão aparecer -->
  <div id="resultado" style="padding: 15px; background: #f3e5f5; border-radius: 10px; margin-top: 20px; font-size: 18px;"></div>

  <script>
    // ==========================================
    // 'a' e 'b' são PARÂMETROS
    // ==========================================
    function somar(a, b) {
      console.log(a + " + " + b + " = " + (a + b));
      
      // Retorna o HTML para mostrar na tela
      return a + " + " + b + " = " + (a + b) + "<br>";
    }

    // ==========================================
    // 10 e 5 são ARGUMENTOS
    // ==========================================
    let resultado = document.getElementById("resultado");
    
    let html = "";
    
    html += somar(10, 5);
    html += somar(20, 3);
    html += somar(100, 50);
    
    resultado.innerHTML = html;
  </script>
</body>
</html>
