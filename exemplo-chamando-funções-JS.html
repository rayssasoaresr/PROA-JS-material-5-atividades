<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Chamando Funções</title>
</head>
<body>
    <h1>📞 Chamando Funções</h1>
    <p>Abra o console (F12)</p>

    <script>
        // 1CRIAR a função
        function mostrarMensagem() {
            console.log("📢 Esta é uma mensagem!");
            console.log("📢 Executando a função!");
        }

        // 2CHAMAR várias vezes
        console.log("--- Chamada 1 ---");
        mostrarMensagem();

        console.log("--- Chamada 2 ---");
        mostrarMensagem();

        console.log("--- Chamada 3 ---");
        mostrarMensagem();
    </script>
</body>
</html>
