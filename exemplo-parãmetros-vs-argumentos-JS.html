<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Parâmetros vs Argumentos</title>
</head>
<body>
    <h1>⚖️ Parâmetros vs Argumentos</h1>
    <p>Abra o console (F12)</p>

    <script>
        // 'a' e 'b' são PARÂMETROS
        function somar(a, b) {
            console.log(a + " + " + b + " = " + (a + b));
        }

        // 10 e 5 são ARGUMENTOS
        somar(10, 5);
        somar(20, 3);
        somar(100, 50);
    </script>
</body>
</html>
